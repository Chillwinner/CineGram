[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cinevec-telegram-plugin"
version = "0.1.0"
description = "Standalone FastAPI Telegram plugin for CineVec multimodal media search"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "python-telegram-bot>=21.0",
    "telethon>=1.36",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
tg-plugin = "tg_plugin.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tg_plugin = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
